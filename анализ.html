<!-- Шахматная доска -->
    <div id="board1"
     style="width: 400px;
    height: 400px;
    margin: 40px 0 0 20px;
    display: inline-block;">
    </div>

   <!-- Кнопка сброса доски -->
    <button onclick="resetBoard()" style="
        background-color: black;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 20px;
        margin-top: 20px;
    ">Сбросить доску</button>
     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Подключаем скрипт доски -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- Запускаем доску -->
    <script>
        var board1; // Объявляем переменную ЗДЕСЬ, чтобы все её видели

        // Функция, которая создаёт доску
        function initBoard() {
            board1 = Chessboard('board1', {
                draggable: true,
                position: 'start'
            });
        }

        // Функция для кнопки "Сбросить"
        function resetBoard() {
            if (board1) {
                board1.position('start');
            } else {
                console.error('Доска еще не загружена!');
            }
        }

        // Запускаем создание доски, когда страница полностью готова
        $(document).ready(function() {
            initBoard();
        });
    </script>
