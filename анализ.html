<html lang="ru">
<head>

<title>Shakalin.com-Анализ</title>
<!-- Подключаем стили шахматной доски из интернета -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body style="background-color: rgba(0, 0, 0, 0.836); color: rgb(255, 255, 255);">
<!-- загаловок сайта -->
<p>
  <span style="font-size: 38px;"><b> ShakalinChess </b> </span> 
</p>
<p>
<!-- кнопка главной страницы -->
<span style="margin-left: 10px; font-size: 20px;">
  <a href="index.html" style="
background-color: black;
color: rgba(255, 255, 255, 0.425);
text-decoration: none;
border: 0px solid white;
padding: 10px 8px;
font-size: 18px;
cursor: pointer;
border-radius: 20px;
">Главная страница</a>
</span>
<!-- кнопка анализа -->
<span style="margin-left: 50px; font-size: 20px;">
  <a href="анализ.html" style="
  background-color: black;
  color: rgb(255, 255, 255);
  text-decoration: none;
  border: 0px solid white;
  padding: 10px 8px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 20px;
  ">Анализ</a>
</span>
<!-- кнопка курсов -->
<span style="margin-left: 50px; font-size: 20px;">
  <a href="курсы.html" style="
  background-color: black;
  color: rgba(255, 255, 255, 0.425);
  text-decoration: none;
  border: 0px solid white;
  padding: 10px 8px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 20px;
  ">Курсы</a>
</span>
</p>
<!-- Шахматная доска -->
    <div id="board1" style="width: 400px; margin: 40px 0 0 20px;"></div>

   <!-- Кнопка сброса доски -->
    <button onclick="board1.position('start')" style="
        background-color: black;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 20px;
        margin-top: 20px;
    ">Сбросить доску</button>
    <!-- Подключаем скрипт доски -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- Запускаем доску -->
    <script>
        var board1 = Chessboard('board1', {
            draggable: true,
            position: 'start'
        });
    </script>

</body>
</html>
